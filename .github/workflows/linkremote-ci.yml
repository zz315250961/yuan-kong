name: LinkRemote Product CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/**'
      - 'server/**'
      - 'tests/**'
      - 'src/client.rs'
      - 'libs/hbb_common'
      - 'src/server/video_policy.rs'
      - 'src/server/video_qos.rs'
      - 'libs/scrap/src/common/**'
  push:
    branches: [master]
    paths:
      - '.github/**'
      - 'server/**'
      - 'tests/**'
      - 'src/client.rs'
      - 'libs/hbb_common'
      - 'src/server/video_policy.rs'
      - 'src/server/video_qos.rs'
      - 'libs/scrap/src/common/**'

jobs:
  scope-and-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - run: python .github/tests/test_release_scope.py -v
      - run: python -m unittest discover -s server/linkremote-api/tests -v
      - run: python -m py_compile server/linkremote-api/app.py server/linkremote-api/reset_password.py

  video-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.75'
      - run: python -m unittest discover -s tests -p test_video_policy_runner.py -v
      - run: python -m unittest discover -s tests -p test_verify_android_artifact.py -v
      - run: python tests/run_video_policy_tests.py
