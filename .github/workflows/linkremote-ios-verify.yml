name: LinkRemote iOS Build Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-unsigned:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Checkout source and native dependencies
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Install Rust and iOS target
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.75'
          targets: aarch64-apple-ios
          components: rustfmt

      - name: Generate Flutter-Rust bridge
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          sed -i '' 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h \
            --class-name Rustdesk
          cp flutter/macos/Runner/bridge_generated.h flutter/ios/Runner/bridge_generated.h

      - name: Install iOS native libraries
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b
          doNotCache: false

      - name: Build native dependencies for iOS
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"

      - name: Build unsigned iOS controller
        shell: bash
        run: ./flutter/build_ios.sh --unsigned

      - name: Upload unsigned app for build inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkremote-ios-unsigned
          path: flutter/build/ios/iphoneos/Runner.app
