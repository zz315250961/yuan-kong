name: LinkRemote iOS Build Verification

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Build targets, or replay an exact Simulator App on clean runners
        type: choice
        options: [both, device, simulator, simulator-ui-replay]
        default: both
      simulator_source_run:
        description: UI replay only - exact source run ID (not a new App build)
        default: '39238496370'
      simulator_source_commit:
        description: UI replay only - exact source commit
        default: '295030cdeabed4ef553199d165042095b955aa51'
      simulator_source_artifact:
        description: UI replay only - exact artifact name in the source run
        default: 'linkremote-ios-simulator-app-1'
      simulator_archive_sha256:
        description: UI replay only - SHA-256 of the original inner App ZIP
        default: '7135bff17972ebccd90c4a9f34515dfadb8a2044ab2d0be76daa592f727b2ff4'
      simulator_app_version:
        description: UI replay only - version of the selected historical App
        default: '1.0.43'
      simulator_app_build:
        description: UI replay only - build number of the selected historical App
        default: '75'
      simulator_fresh_devices:
        description: UI replay only - create QA-owned data containers of the same device types
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  ios-simulator-ui-replay:
    if: inputs.build_target == 'simulator-ui-replay'
    name: ios-ui-replay-${{ matrix.family }}
    runs-on: macos-15-intel
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      REPLAY_EVIDENCE: flutter/build/ios/simulator-replay-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.family }}
    steps:
      - name: Checkout only the UI harness
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify clean runner and source-gate regressions
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          xcodebuild -version
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = 18.5
          sysctl hw.memsize hw.logicalcpu
          vm_stat
          df -h
          xcrun simctl list devices booted
          xcrun simctl help bootstatus
          python3 -m unittest discover -s flutter/ios -p 'test_simulator_smoke.py' -v
          python3 -m unittest discover -s flutter/ios -p 'test_verify_simulator_replay.py' -v

      - name: Download the exact historical Simulator App artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.simulator_source_run }}
          name: ${{ inputs.simulator_source_artifact }}
          path: simulator-replay-source

      - name: Verify source provenance, original ZIP hash and Simulator identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: ${{ inputs.simulator_source_run }}
          SOURCE_COMMIT: ${{ inputs.simulator_source_commit }}
          SOURCE_ARTIFACT: ${{ inputs.simulator_source_artifact }}
          ARCHIVE_SHA256: ${{ inputs.simulator_archive_sha256 }}
          APP_VERSION: ${{ inputs.simulator_app_version }}
          APP_BUILD: ${{ inputs.simulator_app_build }}
        run: |
          python3 flutter/ios/verify_simulator_replay.py \
            --repository "$GITHUB_REPOSITORY" \
            --source-run "$SOURCE_RUN" --source-commit "$SOURCE_COMMIT" \
            --artifact-name "$SOURCE_ARTIFACT" \
            --archive simulator-replay-source/linkremote-ios-simulator.zip \
            --archive-sha256 "$ARCHIVE_SHA256" --version "$APP_VERSION" --build "$APP_BUILD" \
            --provenance-output "$REPLAY_EVIDENCE/source.json"
          # ditto preserves the executable permissions from the original Mac ZIP.
          ditto -x -k simulator-replay-source/linkremote-ios-simulator.zip simulator-replay-app

      - name: Verify one native device family without a preceding compiler workload
        timeout-minutes: 25
        shell: bash
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
          FRESH_DEVICES: ${{ inputs.simulator_fresh_devices }}
        run: |
          fresh_options=()
          if [[ "$FRESH_DEVICES" == true ]]; then
            fresh_options+=(--fresh-devices)
          fi
          python3 flutter/ios/simulator_smoke.py \
            --app simulator-replay-app/Runner.app \
            --family "$DEVICE_FAMILY" --output "$REPLAY_EVIDENCE/ui" "${fresh_options[@]}"

      - name: Preserve replay screenshots, logs and exact historical source
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkremote-ios-ui-replay-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.family }}
          path: ${{ env.REPLAY_EVIDENCE }}
          if-no-files-found: warn

  ios-unsigned:
    if: inputs.build_target != 'simulator-ui-replay'
    name: ios-${{ matrix.mode }}
    # Pin the CPU architecture: macos-15 is now Apple Silicon, while our
    # simulator core and the baseline's x64-ios libraries target Intel.
    runs-on: macos-15-intel
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.build_target == 'device' && '["device"]' || inputs.build_target == 'simulator' && '["simulator"]' || '["device","simulator"]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout source and native dependencies
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Verify selected Xcode and simulator SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devices available

      - name: Check iOS controller configuration and app icons
        run: |
          python3 -m unittest discover -s flutter/ios -p 'test_*.py'
          python3 flutter/ios/verify_controller.py

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Typecheck native voice policy against the real iOS SDK
        shell: bash
        run: |
          flutter precache --ios
          simulator_framework="$(python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['FLUTTER_ROOT']) / 'bin/cache/artifacts/engine/ios/Flutter.xcframework'
          frameworks = list(root.glob('*-simulator/Flutter.framework'))
          if len(frameworks) != 1:
              raise SystemExit('Expected exactly one native Simulator Flutter framework')
          print(frameworks[0].parent)
          PY
          )"
          xcrun --sdk iphonesimulator swiftc -typecheck -swift-version 5 \
            -target x86_64-apple-ios13.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -F "$simulator_framework" flutter/ios/Runner/LinkRemoteVoiceSession.swift

      - name: Install Rust and iOS target
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.75'
          targets: ${{ matrix.mode == 'device' && 'aarch64-apple-ios' || 'x86_64-apple-ios' }}
          components: rustfmt

      - name: Cache Rust builds and pinned native tools
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: linkremote-ios-${{ runner.os }}-${{ runner.arch }}-rust1.75-frb1.80.1-expand1.0.95-nasm2.16.03-${{ matrix.mode }}
          cache-bin: true
          cache-on-failure: true
          cache-directories: ${{ runner.tool_cache }}/linkremote/nasm-2.16.03

      - name: Install Flutter-Rust bridge build tools
        shell: bash
        run: |
          if [[ "$(cargo expand --version 2>/dev/null)" != 'cargo-expand 1.0.95' ]]; then
            cargo install cargo-expand --version 1.0.95 --locked
          fi
          if [[ "$(flutter_rust_bridge_codegen --version 2>/dev/null)" != 'flutter_rust_bridge_codegen 1.80.1' ]]; then
            cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          fi

      - name: Restore native dependency binary packages
        id: native_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/linkremote-vcpkg-binaries
          # Immutable per-attempt snapshots let a retry add packages to a
          # partial native build without replacing an earlier cache entry.
          # The final fallback shares only this SDK/baseline/target's package
          # store; vcpkg still checks each port ABI and rebuilds changed ports.
          key: linkremote-ios-native-${{ runner.os }}-${{ runner.arch }}-xcode16.4-sdk18.5-vcpkg120deac3062162151622ca4860575a33844ba10b-${{ matrix.mode }}-${{ matrix.mode == 'device' && 'arm64-ios-x64-osx' || 'x64-ios-x64-osx' }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            linkremote-ios-native-${{ runner.os }}-${{ runner.arch }}-xcode16.4-sdk18.5-vcpkg120deac3062162151622ca4860575a33844ba10b-${{ matrix.mode }}-${{ matrix.mode == 'device' && 'arm64-ios-x64-osx' || 'x64-ios-x64-osx' }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**') }}-
            linkremote-ios-native-${{ runner.os }}-${{ runner.arch }}-xcode16.4-sdk18.5-vcpkg120deac3062162151622ca4860575a33844ba10b-${{ matrix.mode }}-${{ matrix.mode == 'device' && 'arm64-ios-x64-osx' || 'x64-ios-x64-osx' }}-

      - name: Install iOS native libraries
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgGitCommitId: 120deac3062162151622ca4860575a33844ba10b
          doNotCache: false

      - name: Install native build tools
        shell: bash
        run: |
          brew install pkg-config
          # AOM at our pinned vcpkg baseline parses `nasm -hf` for -Ox. NASM 3
          # changed its help layout, so keep the compatible 2.x assembler,
          # retaining all assembly optimizations rather than disabling SIMD.
          nasm_prefix="$RUNNER_TOOL_CACHE/linkremote/nasm-2.16.03"
          if [[ ! -x "$nasm_prefix/bin/nasm" ]]; then
            nasm_build="$(mktemp -d "$RUNNER_TEMP/linkremote-nasm.XXXXXX")"
            curl --fail --location --retry 3 \
              https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/nasm-2.16.03.tar.xz \
              --output "$nasm_build/nasm-2.16.03.tar.xz"
            printf '1412a1c760bbd05db026b6c0d1657affd6631cd0a63cddb6f73cc6d4aa616148  %s\n' \
              "$nasm_build/nasm-2.16.03.tar.xz" | shasum -a 256 --check
            tar -xf "$nasm_build/nasm-2.16.03.tar.xz" -C "$nasm_build"
            (
              cd "$nasm_build/nasm-2.16.03"
              ./configure --prefix="$nasm_prefix"
              make -j"$(sysctl -n hw.logicalcpu)"
              make install
            )
          fi
          printf '%s\n' "$nasm_prefix/bin" >> "$GITHUB_PATH"
          "$nasm_prefix/bin/nasm" -v
          "$nasm_prefix/bin/nasm" -hf | grep -- -Ox

      - name: Build native dependencies for iOS
        if: matrix.mode == 'device'
        shell: bash
        env:
          # run-vcpkg sets the removed x-gha provider; explicitly replace it.
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/linkremote-vcpkg-binaries,readwrite
        run: |
          mkdir -p "$RUNNER_TEMP/linkremote-vcpkg-binaries"
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-ios --x-install-root="$VCPKG_ROOT/installed"

      - name: Build unsigned iOS controller
        if: matrix.mode == 'device'
        shell: bash
        run: ./flutter/build_ios.sh --unsigned

      - name: Verify Flutter controls and lifecycle regressions
        if: matrix.mode == 'device'
        working-directory: flutter
        run: flutter test --no-pub

      - name: Build simulator native libraries
        if: matrix.mode == 'simulator'
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/linkremote-vcpkg-binaries,readwrite
        run: |
          mkdir -p "$RUNNER_TEMP/linkremote-vcpkg-binaries"
          # Simulator UI smoke uses software decoding; hardware video behavior
          # remains a device check. The existing build scripts expect x64-ios.
          "$VCPKG_ROOT/vcpkg" install --classic \
            aom:x64-ios libjpeg-turbo:x64-ios opus:x64-ios libvpx:x64-ios libyuv:x64-ios \
            aom:x64-osx libjpeg-turbo:x64-osx opus:x64-osx libvpx:x64-osx libyuv:x64-osx \
            --overlay-ports="$PWD/res/vcpkg" --x-install-root="$VCPKG_ROOT/installed"

      - name: Verify simulator AOM assembly object format before Rust LTO
        if: matrix.mode == 'simulator'
        shell: bash
        run: |
          python3 - "$VCPKG_ROOT/installed/x64-ios/lib/libaom.a" <<'PY'
          import struct
          import subprocess
          import sys

          member = "intrapred_asm_sse2.asm.o"
          data = subprocess.check_output(["xcrun", "ar", "-p", sys.argv[1], member])
          if len(data) < 32 or data[:4] != b"\xcf\xfa\xed\xfe":
              raise SystemExit(f"FAIL: {member} must be Mach-O 64-bit, not ELF or another format")
          cpu, _, file_type = struct.unpack_from("<III", data, 4)
          if cpu != 0x01000007 or file_type != 1:
              raise SystemExit(f"FAIL: {member} must be an x86_64 Mach-O object")
          print(f"PASS: {member} is an x86_64 Mach-O object; SIMD remains enabled")
          PY

      - name: Build unsigned Simulator controller
        if: matrix.mode == 'simulator'
        shell: bash
        run: ./flutter/build_ios.sh --simulator

      - name: Upload per-target build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkremote-ios-${{ matrix.mode }}-build-log-${{ github.run_attempt }}
          path: flutter/build/linkremote-ios-logs/*.log
          if-no-files-found: warn

      - name: Archive Simulator app before UI smoke
        if: matrix.mode == 'simulator'
        run: ditto -c -k --keepParent flutter/build/ios/iphonesimulator/Runner.app linkremote-ios-simulator.zip

      - name: Upload Simulator app for independent inspection
        if: matrix.mode == 'simulator'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkremote-ios-simulator-app-${{ github.run_attempt }}
          path: linkremote-ios-simulator.zip
          if-no-files-found: error

      - name: Verify native iPhone and iPad UI
        if: matrix.mode == 'simulator'
        timeout-minutes: 25
        shell: bash
        run: |
          python3 flutter/ios/simulator_smoke.py \
            --app flutter/build/ios/iphonesimulator/Runner.app \
            --fresh-devices \
            --output flutter/build/ios/simulator-smoke-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload native simulator screenshots and logs
        if: always() && matrix.mode == 'simulator'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkremote-ios-simulator-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: flutter/build/ios/simulator-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn

      - name: Archive verified app with executable permissions
        if: matrix.mode == 'device'
        run: ditto -c -k --keepParent flutter/build/ios/iphoneos/Runner.app linkremote-ios-unsigned.zip

      - name: Upload unsigned app for build inspection
        if: matrix.mode == 'device'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkremote-ios-unsigned
          path: linkremote-ios-unsigned.zip
          if-no-files-found: error

      - name: Save completed native dependency packages even after a build failure
        if: always() && steps.native_cache.outputs.cache-primary-key != '' && steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/linkremote-vcpkg-binaries
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
