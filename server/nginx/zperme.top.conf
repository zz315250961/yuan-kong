server {
    listen 80;
    listen [::]:80;
    server_name zperme.top www.zperme.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zperme.top;
    }

    location / {
        return 301 https://zperme.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zperme.top;
    root /var/www/zperme.top;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/zperme.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zperme.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /download/ {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment";
    }

    location = /version/latest {
        proxy_pass http://127.0.0.1:21114/api/version/latest$is_args$args;
        proxy_set_header Host $host;
    }

    location /app/ {
        alias /var/www/zperme.top/app/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # The accounting application's /api/ endpoint is intentionally preserved.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_set_header Host $host;
    }

    location = /remote {
        return 301 /remote/;
    }

    location /remote/ {
        proxy_pass http://127.0.0.1:21114;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 1m;
    }
}
